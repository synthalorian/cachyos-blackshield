name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal

    steps:
      - uses: actions/checkout@v4
        # Code deps only; big asset submodules gated to tag builds below.
        with:
          submodules: false

      # ADJUST: if your framework isn't a submodule (e.g. JUCE resolved via
      # ~/.juce or -DJUCE_DIR), fetch the pinned release here.
      - name: Fetch JUCE (pinned)
        run: git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"

      # ADJUST: your code submodules. --recursive if they nest.
      - name: Init code submodules
        run: git submodule update --init --recursive libs/clap-juce-extensions

      - name: Init asset submodules (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: git submodule update --init --recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libgl1-mesa-dev \
            libfreetype6-dev libfontconfig1-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="$RUNNER_TEMP/JUCE"

      - name: Build
        run: cmake --build build --config Release -j 4

      # Multi-config generators (MSVC) put binaries under build/Release/
      - name: Run tests
        shell: bash
        run: |
          if [ -x ./build/fx_tests ]; then
            ./build/fx_tests
          else
            ./build/Release/fx_tests.exe
          fi

      # ADJUST: artifact packaging per OS
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf dist/app-${{ matrix.name }}.tar.gz -C build/artefacts/Release .

      - name: Package (Windows / macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cd build/artefacts/Release
          zip -r "$GITHUB_WORKSPACE/dist/app-${{ matrix.name }}.zip" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: dist/
          retention-days: 14

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
