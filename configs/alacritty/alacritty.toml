# Blackshield Mercenary — Alacritty
# Black steel, blood-red cross potent. Caerleon after dark.
# Mirrors kitty.conf / ghostty-blackshield.ghostty.
# Font: Xanh Mono (text) + Symbols Nerd Font fallback for glyphs.

[general]
import = []

[window]
padding = { x = 12, y = 12 }
opacity = 0.94
decorations = "None"
startup_mode = "Maximized"
title = "blackshield"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12.0

[font.normal]
family = "Xanh Mono"
style = "Regular"

[font.bold]
family = "Xanh Mono"
style = "Regular"

[font.italic]
family = "Xanh Mono"
style = "Regular"

[font.bold_italic]
family = "Xanh Mono"
style = "Regular"

# Nerd Font symbols ride along via fontconfig fallback
# (~/.local/share/fonts/NerdFontsSymbolsOnly + nerd-font-symbols.conf)

[colors.primary]
background = "#101014"
foreground = "#D8D3C8"
dim_foreground = "#8A8F98"
bright_foreground = "#F5F1E8"

[colors.cursor]
text = "#101014"
cursor = "#E5383B"

[colors.vi_mode_cursor]
text = "#101014"
cursor = "#C1121F"

[colors.selection]
text = "#F5F1E8"
background = "#C1121F"

[colors.search.matches]
foreground = "#101014"
background = "#C9A227"

[colors.search.focused_match]
foreground = "#101014"
background = "#E5383B"

[colors.footer_bar]
foreground = "#D8D3C8"
background = "#1A1A20"

[colors.normal]
black   = "#101014"
red     = "#C1121F"
green   = "#6A994E"
yellow  = "#C9A227"
blue    = "#5B7FA6"
magenta = "#700000"
cyan    = "#4E8F8B"
white   = "#D8D3C8"

[colors.bright]
black   = "#26262E"
red     = "#E5383B"
green   = "#8FBF6F"
yellow  = "#E3C558"
blue    = "#7FA3CC"
magenta = "#E5383B"
cyan    = "#74B8B4"
white   = "#F5F1E8"

[colors.dim]
black   = "#0D0D11"
red     = "#780000"
green   = "#4A6E37"
yellow  = "#8F741B"
blue    = "#3E5876"
magenta = "#4e0a10"
cyan    = "#376967"
white   = "#A39E92"

[keyboard]
bindings = [
  { key = "F11", action = "ToggleFullscreen" },
  { key = "Equals", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
  { key = "Key0", mods = "Control", action = "ResetFontSize" },
]
