# Blackshield Mercenary — kitty
# Black steel, blood-red cross potent. Caerleon after dark.
# Mirrors alacritty-blackshield.toml / ghostty-blackshield.ghostty.
# Font: EB Garamond (text) + Symbols Nerd Font Mono (glyph fallback)

# ── Font ──────────────────────────────────────────────
font_family      EB Garamond
bold_font        EB Garamond
italic_font      EB Garamond
bold_italic_font EB Garamond
font_size        12.0

# Nerd Font symbols: map private-use glyphs to the symbols-only nerd font
symbol_map U+E000-U+F8FF,U+1F300-U+1FAFF Symbols Nerd Font Mono

# ── Window ────────────────────────────────────────────
window_padding_width     12
background_opacity       0.94
hide_window_decorations  yes
remember_window_size     yes
confirm_os_window_close  0

# ── Scrollback ────────────────────────────────────────
scrollback_lines        10000
wheel_scroll_multiplier 3.0

# ── Cursor ────────────────────────────────────────────
cursor                #E5383B
cursor_text_color     #101014
cursor_shape          block
cursor_blink_interval 0.75

# ── Colors ────────────────────────────────────────────
background            #101014
foreground            #D8D3C8
selection_background  #C1121F
selection_foreground  #F5F1E8
url_color             #74B8B4

# Window borders (kitty splits)
active_border_color   #C1121F
inactive_border_color #26262E
bell_border_color     #C9A227

# Tab bar — blacksteel chrome
tab_bar_style          powerline
tab_powerline_style    slanted
tab_bar_background     #0D0D11
active_tab_foreground  #101014
active_tab_background  #C1121F
active_tab_font_style  bold
inactive_tab_foreground #8A8F98
inactive_tab_background #1A1A20
tab_title_template     " {index}: {title} "

# 16-color palette — blood & steel
color0  #101014
color1  #C1121F
color2  #6A994E
color3  #C9A227
color4  #5B7FA6
color5  #700000
color6  #4E8F8B
color7  #D8D3C8

color8  #26262E
color9  #E5383B
color10 #8FBF6F
color11 #E3C558
color12 #7FA3CC
color13 #E5383B
color14 #74B8B4
color15 #F5F1E8

# ── Key bindings (mirrors alacritty) ─────────────────
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0
map f11         toggle_fullscreen
