# Synthwave '84 — kitty
# Mirrored from ~/.config/alacritty/alacritty.toml (verified 2026-07-22)
# Palette: #240037 deep purple bg, #8F00FF electric purple,
#          #FF7EDB hot pink, #FF00FF magenta, #F3E70F neon yellow

# ── Font ──────────────────────────────────────────────
font_family      3270 Nerd Font
bold_font        3270 Nerd Font
italic_font      3270 Nerd Font
bold_italic_font 3270 Nerd Font
font_size        12.0

# ── Window ────────────────────────────────────────────
window_padding_width     12
background_opacity       0.92
hide_window_decorations  yes
remember_window_size     yes
confirm_os_window_close  0

# ── Scrollback ────────────────────────────────────────
scrollback_lines        10000
wheel_scroll_multiplier 3.0

# ── Cursor ────────────────────────────────────────────
cursor                #F3E70F
cursor_text_color     #240037
cursor_shape          block
cursor_blink_interval 0.75

# ── Colors ────────────────────────────────────────────
background            #240037
foreground            #FF7EDB
selection_background  #8F00FF
selection_foreground  #240037
url_color             #03EDF9

# Window borders (kitty splits)
active_border_color   #FF00FF
inactive_border_color #4B0080
bell_border_color     #F3E70F

# Tab bar — synthwave chrome
tab_bar_style          powerline
tab_powerline_style    slanted
tab_bar_background     #240037
active_tab_foreground  #240037
active_tab_background  #FF7EDB
active_tab_font_style  bold
inactive_tab_foreground #FF7EDB
inactive_tab_background #4B0080
tab_title_template     " {index}: {title} "

# 16-color palette
color0  #240037
color1  #FE4450
color2  #72F1B8
color3  #F3E70F
color4  #8F00FF
color5  #FF00FF
color6  #03EDF9
color7  #FF7EDB

color8  #495495
color9  #FE4450
color10 #72F1B8
color11 #FEDE5D
color12 #B084EB
color13 #FF7EDB
color14 #03EDF9
color15 #FFFFFF

# ── Key bindings (mirrors alacritty) ─────────────────
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0
map f11         toggle_fullscreen
