<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blackshield</title>
<style>
  :root {
    --bs-black: #070709;
    --bs-steel: #26262e;
    --bs-bone: #d8d3c8;
    --bs-blood: #c1121f;
    --bs-gold: #c9a227;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bs-black);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "EB Garamond", serif;
    color: var(--bs-bone);
    overflow: hidden;
  }
  .standard {
    width: min(38vh, 340px);
    height: auto;
    filter: drop-shadow(0 0 28px rgba(193, 18, 31, 0.35));
    user-select: none;
    -webkit-user-drag: none;
  }
  form {
    margin-top: 5vh;
    width: min(560px, 72vw);
    display: flex;
  }
  input[type="text"] {
    flex: 1;
    background: #0d0d11;
    border: 1px solid var(--bs-steel);
    border-bottom: 2px solid var(--bs-blood);
    border-radius: 4px;
    padding: 12px 16px;
    font-family: inherit;
    font-size: 17px;
    color: var(--bs-bone);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="text"]::placeholder { color: #6b6f78; font-style: italic; }
  input[type="text"]:focus {
    border-color: var(--bs-blood);
    box-shadow: 0 0 14px rgba(193, 18, 31, 0.35);
  }
  .motto {
    margin-top: 2.2vh;
    font-size: 13px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #565a64;
  }
  .motto em { color: var(--bs-blood); font-style: normal; }
</style>
</head>
<body>
  <img class="standard" src="shield.png" alt="Blackshield standard">
  <form action="https://www.google.com/search" method="get">
    <input type="text" name="q" placeholder="Raise the standard. Ask." autofocus autocomplete="off">
  </form>
  <div class="motto">The shield holds <em>·</em> Caerleon after dark</div>
</body>
</html>
